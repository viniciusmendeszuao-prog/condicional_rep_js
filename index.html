<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATV_condicional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Valor da Compra</h2>
    
        <form id="formulario">
            <label for="valor">Digite o valor (R$)</label>
            <input type="number" id="valor" min="0" step="0.01" required>
            <button type="submit">Calcular</button>
        </form>
    
        <div id="resultado"></div>
    </div>

    <script src="main.js">
    </script>
</body>
</html>
